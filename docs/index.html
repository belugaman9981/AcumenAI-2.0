<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AcumenAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>AcumenAI</h1>
        <p>Local agent UI</p>
      </div>
      <button id="settingsBtn">Pair</button>
    </header>

    <section id="status">Not connected</section>
    <section id="chat"></section>

    <form id="form">
      <input id="message" autocomplete="off" placeholder="Ask Acumen anything…">
      <button>Send</button>
    </form>

    <details>
      <summary>Saved knowledge</summary>
      <button id="refreshKnowledge" type="button">Refresh</button>
      <div id="knowledge"></div>
    </details>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h2>Pair with local Acumen</h2>
      <label>
        Bridge URL
        <input id="bridgeUrl" value="http://127.0.0.1:8765">
      </label>
      <label>
        Pairing token
        <input id="token" type="password">
      </label>
      <button id="saveSettings" value="default">Save</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
