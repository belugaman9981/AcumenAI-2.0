app:
  name: AcumenAI 2.0
  version: "0.4.5"

storage:
  root: data

research:
  max_search_results: 5
  max_pages_to_scrape: 3
  request_timeout: 10
  max_page_chars: 120000
  # Independent providers and pages may fetch concurrently.
  max_workers: 4
  # Keep a small, temporary cache; set TTL to 0 to disable it.
  cache_ttl_seconds: 300
  cache_max_entries: 128
  # Stop reading large responses after this many decompressed bytes.
  max_page_bytes: 524288

tasks:
  wait_seconds: 45
  poll_interval: 0.25

web:
  bridge_host: 127.0.0.1
  bridge_port: 8765
  allowed_origins:
    - http://127.0.0.1:8765
    - http://localhost:8765
  pairing_token: change-me
